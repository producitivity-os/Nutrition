name: Nutrition

options:
  bundleIdPrefix: com.productivitysuite
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Nutrition:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Sources/Nutrition
        excludes:
          - Resources
          - Mobile
      - path: Sources/Nutrition/Mobile/Cloud
    resources:
      - path: Sources/Nutrition/Resources
    dependencies:
      - sdk: MapKit.framework
      - sdk: CloudKit.framework
    entitlements:
      path: Sources/Nutrition/Nutrition.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.productivitysuite.nutrition
        com.apple.developer.icloud-services:
          - CloudKit

    info:
      path: Sources/Nutrition/Info.plist
      properties:
        CFBundleDisplayName: Nutrition
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSUbiquitousContainers:
          iCloud.com.productivitysuite.nutrition:
            NSUbiquitousContainerIsDocumentScopePublic: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition
        PRODUCT_NAME: Nutrition
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NutritionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/NutritionTests
    dependencies:
      - target: Nutrition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition.tests
        GENERATE_INFOPLIST_FILE: YES

  NutritionMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Nutrition/Models/NutritionSchema.swift
      - path: Sources/Nutrition/Services/NutritionCalculator.swift
      - path: Sources/Nutrition/Services/NutritionSeedData.swift
      - path: Sources/Nutrition/Services/NutritionStoreActor.swift
      - path: Sources/Nutrition/Services/PlanningSupport.swift
      - path: Sources/Nutrition/Mobile
    resources:
      - path: Sources/Nutrition/Resources
    dependencies:
      - sdk: HealthKit.framework
      - sdk: HealthKitUI.framework
      - sdk: CloudKit.framework
      - sdk: MapKit.framework
    entitlements:
      path: Sources/Nutrition/Mobile/NutritionMobile.entitlements
    info:
      path: Sources/Nutrition/Mobile/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition.ios
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NutritionMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/NutritionMobileTests
    dependencies:
      - target: NutritionMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nutrition:
    shared: true
    build:
      targets:
        Nutrition: all
        NutritionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NutritionTests
    archive:
      config: Release
  NutritionMobile:
    shared: true
    build:
      targets:
        NutritionMobile: all
        NutritionMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NutritionMobileTests]
    archive:
      config: Release
