name: Nutrition

options:
  bundleIdPrefix: com.productivitysuite
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  ProductivityUI:
    path: ../../packages/ProductivityUI
  ProductivityRoutineKit:
    path: ../../packages/ProductivityRoutineKit

targets:
  Nutrition:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Sources/Shared
      - path: Sources/macOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ProductivityUI
      - package: ProductivityRoutineKit
      - sdk: MapKit.framework
      - sdk: CloudKit.framework
    entitlements:
      path: Sources/macOS/Platform/Nutrition.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.productivitysuite.nutrition
        com.apple.developer.icloud-services:
          - CloudKit

    info:
      path: Sources/macOS/Platform/Info.plist
      properties:
        CFBundleDisplayName: Nutrition
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSUbiquitousContainers:
          iCloud.com.productivitysuite.nutrition:
            NSUbiquitousContainerIsDocumentScopePublic: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition
        PRODUCT_NAME: Nutrition
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NutritionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/SharedTests
      - path: Tests/macOSTests
    dependencies:
      - target: Nutrition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition.tests
        GENERATE_INFOPLIST_FILE: YES

  NutritionIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ProductivityUI
      - package: ProductivityRoutineKit
      - sdk: HealthKit.framework
      - sdk: HealthKitUI.framework
      - sdk: CloudKit.framework
      - sdk: MapKit.framework
    entitlements:
      path: Sources/iOS/Platform/NutritionIOS.entitlements
    info:
      path: Sources/iOS/Platform/Info.plist
      properties:
        CFBundleDisplayName: Nutrition
        NSHealthShareUsageDescription: Nutrition reads active energy, workouts, and body mass to calculate your daily energy balance.
        NSHealthUpdateUsageDescription: Nutrition saves logged meals, nutrients, and weight to Apple Health when you enable Health integration.
        CFBundleURLTypes:
          - CFBundleURLName: com.productivitysuite.nutrition.actions
            CFBundleURLSchemes: [productivity-nutrition]
        LSApplicationQueriesSchemes: [productivity-routines]
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition.ios
        PRODUCT_NAME: Nutrition
        PRODUCT_MODULE_NAME: NutritionIOS
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  NutritionIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SharedTests
      - path: Tests/iOSTests
    dependencies:
      - target: NutritionIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.nutrition.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Nutrition.app/Nutrition
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Nutrition:
    shared: true
    build:
      targets:
        Nutrition: all
        NutritionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NutritionTests
    archive:
      config: Release
  NutritionIOS:
    shared: true
    build:
      targets:
        NutritionIOS: all
        NutritionIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NutritionIOSTests]
    archive:
      config: Release
